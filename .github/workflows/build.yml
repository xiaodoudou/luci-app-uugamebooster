name: Build packages

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release with the built packages"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_NAME: luci-app-uugamebooster
  PACKAGE_DIR: luci-app-uugamebooster
  ZIG_VERSION: "0.13.0"

permissions:
  contents: write

# Pinned rather than ubuntu-latest, which migrates to Ubuntu 26 from
# 2026-10-19. This builds release artifacts for routers, so the toolchain moving
# under us unannounced is worth more than being on the newest image. Bump it
# deliberately, having checked the SDK still builds.
jobs:
  # The packages people actually install. An OpenWrt SDK cannot build these:
  # the view filters target five architectures at once, and the emulator is a
  # prebuilt binary, so both are assembled out of tree by tools/.
  package:
    name: Package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install zig
        run: |
          curl -sSLo /tmp/zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz"
          mkdir -p "$HOME/zig"
          tar xf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - name: Build the view filters
        run: |
          sh tools/build-preload.sh
          ls -l payload/preload/

      - name: Check the translation catalogue
        # Every string the sources ask for has to be in the .po, and every
        # string in the .po has to still exist in the sources.
        run: |
          python3 tools/i18n-scan.py /tmp/scanned.pot
          python3 - <<'EOF'
          import re, sys
          sys.path.insert(0, "tools")
          from po2lmo import parse_po, unescape
          pot = open("/tmp/scanned.pot", encoding="utf-8").read()
          want = [unescape(m) for m in re.findall(r'^msgid "(.*)"$', pot, re.M) if m]
          have = dict(parse_po("luci-app-uugamebooster/po/zh_Hans/uugamebooster.po"))
          missing = [w for w in want if w not in have]
          stale = [k for k in have if k not in want]
          for m in missing:
              print("missing translation: %s" % m[:100])
          for s in stale:
              print("stale translation:   %s" % s[:100])
          print("%d strings, %d translated" % (len(want), len(have)))
          sys.exit(1 if (missing or stale) else 0)
          EOF

      - name: Build both flavours
        # No output name given, so mkipk.py names each file from the version in
        # the Makefile. Release assets then say which build they are.
        run: |
          mkdir -p dist
          cd dist
          python3 ../tools/mkipk.py --arch x86_64
          python3 ../tools/mkipk.py --arch all
          ls -l

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: uugamebooster-packages
          path: dist/*.ipk

  # The APK flavour, for snapshot builds that use apk instead of opkg, plus a
  # check that the Makefile and the feed dependencies still work - they are only
  # exercised here. The view filters are compiled in first, so what comes out is
  # a complete package; only the emulator is missing, and that is downloaded and
  # checksummed on first use of the emulated build.
  sdk:
    name: SDK build (${{ matrix.target.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: ipk
            sdk_url: "https://downloads.openwrt.org/releases/23.05.5/targets/x86/64/openwrt-sdk-23.05.5-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz"
            sdk_tar: SDK.tar.xz
            sdk_dir: SDK
          - name: apk
            sdk_url: snapshot
            sdk_tar: SNAPSDK.tar.zst
            sdk_dir: SNAPSDK
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get -y install curl git tar zstd python3 python3-pyelftools python3-setuptools

      - name: Install zig
        run: |
          curl -sSLo /tmp/zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz"
          mkdir -p "$HOME/zig"
          tar xf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - name: Compile the view filters into the package
        # luci.mk packages everything under root/, so this is all it takes for an
        # SDK build to carry them.
        run: |
          sh tools/build-preload.sh "${PACKAGE_DIR}/root/usr/lib/uuplugin"
          ls -l "${PACKAGE_DIR}/root/usr/lib/uuplugin/"

      - name: Download the OpenWrt SDK
        run: |
          mkdir -p tmp
          if [ "${{ matrix.target.name }}" = "ipk" ]; then
            curl -SLk --connect-timeout 30 --retry 2 "${{ matrix.target.sdk_url }}" -o "./tmp/${{ matrix.target.sdk_tar }}"
            cd tmp
            tar xf ${{ matrix.target.sdk_tar }}
            mv openwrt-sdk-* ${{ matrix.target.sdk_dir }}
          else
            BASE_URL="https://downloads.openwrt.org/snapshots/targets/x86/64/"
            SDK_NAME=$(curl -s $BASE_URL | grep -oE 'openwrt-sdk-x86-64[^"]+\.tar\.zst' | head -n 1)
            curl -SLk --connect-timeout 30 --retry 2 "$BASE_URL/$SDK_NAME" -o "./tmp/${{ matrix.target.sdk_tar }}"
            cd tmp
            zstd -d ${{ matrix.target.sdk_tar }}
            tar xf SNAPSDK.tar
            SDK_DIR=$(tar tf SNAPSDK.tar | head -n 1 | cut -d/ -f1)
            mv "$SDK_DIR" "${{ matrix.target.sdk_dir }}"
          fi

      - name: Copy the package into the SDK
        run: |
          mkdir -p "tmp/${{ matrix.target.sdk_dir }}/package/${PACKAGE_NAME}"
          cp -a "${PACKAGE_DIR}/." "tmp/${{ matrix.target.sdk_dir }}/package/${PACKAGE_NAME}/"

      - name: Install feeds
        run: |
          cd tmp/${{ matrix.target.sdk_dir }}
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "CONFIG_PACKAGE_${PACKAGE_NAME}=m" >> .config
          make defconfig

      - name: Build
        run: |
          cd tmp/${{ matrix.target.sdk_dir }}
          make "package/${PACKAGE_NAME}/compile" V=s

      - name: Confirm the SDK produced a complete package
        # luci.mk runs po2lmo itself, so the catalogue check also confirms the po
        # file is valid input for the real tool and not just for ours.
        run: |
          cd tmp/${{ matrix.target.sdk_dir }}
          find . -name 'uugamebooster.zh-cn.lmo' -print -quit | grep . \
            || { echo "no catalogue produced by the SDK build"; exit 1; }
          find . -name 'uu-view-preload-aarch64.so' -print -quit | grep . \
            || { echo "view filters missing from the SDK build"; exit 1; }

      - name: Collect the package
        run: |
          mkdir -p out
          find "tmp/${{ matrix.target.sdk_dir }}/bin" \
            -name "luci-app-uugamebooster*.${{ matrix.target.name }}" \
            -exec cp {} out/ \;
          ls -l out/

      # Only the apk is kept. The ipk from here would collide with the one built
      # by mkipk.py, which is the same package plus the bundled emulator.
      - name: Upload the apk
        if: ${{ matrix.target.name == 'apk' }}
        uses: actions/upload-artifact@v7
        with:
          name: uugamebooster-apk
          path: out/*.apk
          if-no-files-found: error

  release:
    # Only ever publishes when a human explicitly asks for it.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    runs-on: ubuntu-24.04
    needs: [package, sdk]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          VERSION="$(awk -F ':=' '/^PKG_VERSION:=/ { print $2; exit }' "./${PACKAGE_DIR}/Makefile")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: ./

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            LuCI app for the NetEase UU Game Booster: PC and phone boosting,
            OpenClash coexistence, a device list, and an English or Chinese UI
            following LuCI's language setting.

            Two flavours:

            | File | For |
            |---|---|
            | `..._x86_64.ipk` | x86_64 routers on opkg. Bundles the emulator, so the vendor build needs no extra download. |
            | `..._all.ipk` | Any other target on opkg. The vendor build runs natively where the CPU matches; on x86_64 the emulator is downloaded on first use. |
            | `....apk` | Snapshot builds, which use apk rather than opkg. |

            ```
            opkg install luci-app-uugamebooster_*.ipk
            apk add --allow-untrusted luci-app-uugamebooster*.apk
            ```

            Every dependency is declared, so there is nothing to fetch by hand.
          files: |
            luci-app-uugamebooster_*.ipk
            luci-app-uugamebooster*.apk
