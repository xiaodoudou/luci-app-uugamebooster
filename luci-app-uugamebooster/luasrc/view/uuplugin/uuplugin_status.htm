<style type="text/css">
/* Layout comes from LuCI's own cbi-value / cbi-value-title / cbi-value-field
   classes, so labels pick up the theme's normal label colour and the rows line
   up with the settings form below. Only the bits LuCI has no class for are
   styled here, and those derive from currentColor so they work on light and
   dark themes alike. */
#uu-status .uu-dot {
	display: inline-block;
	width: .6em;
	height: .6em;
	border-radius: 50%;
	margin-right: .5em;
	background: rgba(128, 128, 128, .45);
}
#uu-status .ok   { background: #3fa14a; }
#uu-status .bad  { background: #e05252; }
#uu-status .warn { background: #e0912f; }
#uu-status .t-ok   { color: #3fa14a; font-weight: 600; }
#uu-status .t-bad  { color: #e05252; font-weight: 600; }
#uu-status .t-warn { color: #e0912f; font-weight: 600; }

/* One pill per proxy. Borders derive from currentColor so the row reads the
   same on a light and a dark theme without knowing which one is in use. */
#uu-status .uu-chip {
	display: inline-block;
	padding: .12em .55em;
	margin: .15em .35em .15em 0;
	border: 1px solid rgba(128, 128, 128, .35);
	border-radius: 1em;
	line-height: 1.7;
	white-space: nowrap;
}

#uu-status .uu-muted { opacity: .6; }
#uu-status .uu-num { font-weight: 600; }

/* Inherit the surrounding colour: themes otherwise force a dark foreground on
   <code>, which vanishes against a dark panel. */
#uu-status code {
	color: inherit;
	background: rgba(128, 128, 128, .20);
	border: 1px solid rgba(128, 128, 128, .26);
	padding: .08em .45em;
	border-radius: 3px;
	font-size: .92em;
	white-space: nowrap;
}

#uu-status .uu-alert {
	margin: .5em 0;
	padding: .65em .85em;
	border-left: 3px solid #e05252;
	background: rgba(224, 82, 82, .12);
	border-radius: 3px;
	line-height: 1.6;
}
</style>

<script type="text/javascript">//<![CDATA[
function uuRow(k, v, last) {
	return '<div class="cbi-value' + (last ? ' cbi-value-last' : '') + '">' +
	       '<label class="cbi-value-title">' + k + '</label>' +
	       '<div class="cbi-value-field">' + v + '</div>' +
	       '</div>';
}

var uuUrl = '<%=url([[admin]], [[services]], [[uuplugin]], [[status]])%>';

function uuRender(d) {
		var el = document.getElementById('uu-status');
		if (!d || !el) return;

		// Rows are collected first and rendered last, so whichever one comes out
		// last gets the cbi-value-last class regardless of which proxies are
		// installed. The panel used to spell that out by hand for every
		// combination, and adding a proxy meant editing all of them again.
		var rows = [], alerts = '';
		function row(k, v) { rows.push([k, v]); }

		// "Running" alone is misleading: after every start the plugin has to
		// reach NetEase before the phone app can find the router.
		var svc;
		if (d.phase == 'ready')
			svc = '<span class="uu-dot ok"></span><span class="t-ok"><%:Ready%></span>';
		else if (d.phase == 'starting')
			svc = '<span class="uu-dot warn"></span><span class="t-warn"><%:Starting%>&hellip;</span>' +
			      ' <span class="uu-muted">&ndash; <%:no connection to NetEase yet%></span>';
		else
			svc = '<span class="uu-dot bad"></span><span class="t-bad"><%:Not running%></span>';
		row('<%:Service%>', svc);

		// The control server address says which NetEase endpoint the tunnel is
		// talking to, and it changes between sessions.
		if (d.running) {
			row('<%:NetEase link%>', d.cloud
				? '<span class="uu-dot ok"></span><code>' + d.cloud + '</code>'
				: '<span class="uu-muted"><%:connecting%>&hellip;</span>');
		}

		if (d.no_bootstart) {
			alerts += '<div class="uu-alert"><span class="t-bad"><%:Will not start after a reboot%></span><br />' +
			     '<%:Boot start is off although the service is enabled. Save & Apply, or run%> ' +
			     '<code>/etc/init.d/uuplugin enable</code><%:, to turn it back on.%></div>';
		}

		if (d.foreign) {
			alerts += '<div class="uu-alert"><span class="t-bad"><%:Conflicting UU installation%></span><br />' +
			     '<code>' + d.foreign + '</code><br />' +
			     '<%:It owns the PID file, so this service cannot start. Run%> ' +
			     '<code>/etc/init.d/uuplugin takeover</code> <%:to hand over.%></div>';
		}

		var buildText = {
			'oem-native':   '<%:vendor build, running natively - consoles, PCs and phones%>',
			'oem-emulated': '<%:vendor build, emulated - consoles, PCs and phones%>',
			'generic':      '<%:standard build - game consoles only%>'
		}[d.build] || '';
		row('<%:Running%>', '<code>' + (d.arch || '?') + '</code>' +
			(buildText ? ' <span class="uu-muted">' + buildText + '</span>' : '') +
			(d.dnat_fallback ? '<br /><span class="uu-muted"><%:iptables here has no DNAT target; nftables handles the UU DNS redirect instead.%></span>' : ''));

		row('<%:Tunnel%>', d.tun
			? '<code>' + d.tun + '</code>'
			: '<span class="uu-muted"><%:none yet%></span>');

		row('<%:Boosted devices%>', d.boosted
			? '<span class="uu-dot ok"></span><code>' +
			  d.boosted.replace(/ /g, '</code> <code>') + '</code>'
			: '<span class="uu-muted"><%:none - boost a device in the UU app%></span>');

		// One line for all of them. A row per proxy plus a row per exemption
		// pushed everything else off the panel once four were installed, and
		// the only things worth scanning are "is it on" and "how many
		// destinations are currently kept out of it".
		if (d.sync && d.sync.length) {
			var chips = [];
			d.sync.forEach(function(s) {
				if (s.mode == 'off') {
					chips.push('<span class="uu-chip">' +
						'<span class="uu-dot"></span>' +
						'<span class="uu-muted">' + s.label +
						' <%:left alone%></span></span>');
					return;
				}

				if (!s.running) {
					chips.push('<span class="uu-chip">' +
						'<span class="uu-dot warn"></span>' +
						'<span class="t-warn">' + s.label + '</span> ' +
						'<span class="uu-muted"><%:not running%></span></span>');
					return;
				}

				// The count means different things per mode: destinations kept
				// out of a split, or devices taken off the proxy entirely.
				var chip = '<span class="uu-chip">' +
					'<span class="uu-dot ok"></span>' +
					'<span class="t-ok">' + s.label + '</span>' +
					((s.exempted > 0)
						? ' <span class="uu-num">' + s.exempted + '</span>' +
						  ' <span class="uu-muted">' +
						  ((s.mode == 'bypass')
							? '<%:devices excluded%>'
							: '<%:exempted%>') +
						  '</span>'
						: ' <span class="uu-muted"><%:nothing to exempt%></span>');

				// A proxy installed in a mode this cannot reach: worth a mark,
				// not a whole row.
				if (s.note == 'tun-only')
					chip += ' <span class="t-warn" title="<%:Only its TUN mode with auto-redirect is handled.%>">!</span>';

				chips.push(chip + '</span>');
			});
			row('<%:Coexistence%>', chips.join(' '));
		}

		var h = '';
		for (var i = 0; i < rows.length; i++)
			h += uuRow(rows[i][0], rows[i][1], i == rows.length - 1);
		el.innerHTML = h + alerts;
}

// Deliberately not XHR.poll(). Two reasons, both things that went wrong with it:
// its first request waits for the interval to elapse, so the panel sat on
// "Collecting data..." with nothing to show; and LuCI halts its polling while a
// Save & Apply is in flight, which left the panel frozen on the old state until
// the page was reloaded by hand.
//
// A plain interval starts immediately, survives the apply overlay, and a bad
// response cannot stop the loop.
function uuFetch() {
	if (document.hidden)
		return;                  // no point polling a tab nobody is looking at
	var x = new XMLHttpRequest();
	x.open('GET', uuUrl + '?_=' + Date.now(), true);
	x.onload = function() {
		try {
			uuRender(JSON.parse(x.responseText));
		} catch (e) {
			/* Keep polling. One bad response is not a reason to stop. */
		}
	};
	x.send();
}

uuFetch();
setInterval(uuFetch, 1000);
document.addEventListener('visibilitychange', function() {
	if (!document.hidden) uuFetch();
});
//]]></script>

<fieldset class="cbi-section">
	<legend><%:Status%></legend>
	<div id="uu-status"><em><%:Collecting data...%></em></div>
</fieldset>
